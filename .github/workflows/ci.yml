name: CI

# Wires this repo's existing self-checks into GitHub Actions.
#
# Two tiers, because the checks this repo already has do not share a
# toolchain dependency:
#
#   checks       -- headless. No PDK, no xschem, no GUI. Runs on every
#                   push/PR so a broken harness or a bad Python change is
#                   caught immediately, in a bare runner with no extra
#                   install step.
#   pdk-checks   -- requires the gf180mcu PDK (via volare) and xschem on
#                   PATH. These catch netlist drift against the committed
#                   schematics, which only matters when design/ changes and
#                   is not worth an install step on every PR. So it runs on
#                   the nightly schedule, on manual dispatch, and on any PR
#                   that touches design/ -- the latter detected by the
#                   design-changed job below, because GitHub Actions has no
#                   per-job `paths:` filter. The `ci:full` label (declared in
#                   .github/labels.yml) forces it on for a PR that leaves
#                   design/ alone, e.g. one editing design/netlist.sh's
#                   callers, this workflow, or the PDK pin.
#
# Self-checks intentionally NOT wired here:
#   - sim/run-all.sh, sim/lib/simenv.sh, and the per-campaign
#     sim/*/testbench/run.sh scripts are full PVT campaign runners invoked
#     by run_corners.py / selftest.sh, not standalone CI smoke checks --
#     see the "checks" and "pdk-checks" jobs below for what those exercise.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly PDK-dependent run -- see the pdk-checks job below for why this
    # is not on every push/PR.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

jobs:
  checks:
    name: checks (headless -- no PDK/xschem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install the klayout pip wheel (klayout.db -- not the standalone app binary)
        # This is the `klayout` PyPI package providing `klayout.db`, distinct
        # from the standalone KLayout application binary used for DRC/LVS
        # decks (see layout/README.md -- "The two KLayouts"). It needs no
        # PDK, no xschem, and no extra system libs on ubuntu-latest, so it's
        # cheap to install on every PR. Installing it here is what flips the
        # layout/tests/*.py tests below from `@unittest.skipUnless(HAVE_KLAYOUT,
        # ...)`-skipped to actually run/pass in this job (issue #349) --
        # without it every such test (including the VCO n-well geometric
        # verification gate added in #339/#345) silently never executes.
        run: pip install klayout

      - name: sim/selftest.sh
        # Default mode: harness unit tests always run (no PDK needed). The
        # end-to-end PVT smoke stage self-skips with exit 0 when ngspice /
        # the gf180mcu PDK are absent (which they are on this runner) --
        # see sim/selftest.sh. Do NOT pass --require-pdk here.
        run: bash sim/selftest.sh

      - name: layout/tests (harness unit tests + klayout.db-gated tests)
        # layout/harness/drc.py's two pure functions (parse_report_db,
        # rules_from_log) have zero PDK/KLayout dependency and always ran
        # here. With the klayout pip wheel installed above, the
        # `@unittest.skipUnless(HAVE_KLAYOUT, ...)`-gated tests across
        # layout/tests/ (e.g. test_vco_layout.py, test_divider_chain.py,
        # test_cp_leg_devgen.py) now run too. lvs.py and faults.py's
        # subprocess-driving functions (the standalone KLayout app binary,
        # DRC/LVS decks) are still not covered here -- those require the
        # full PDK toolchain and belong in pdk-checks, not this headless job.
        run: python3 -m unittest discover -s layout/tests -t layout/tests

      - name: spec/tests (unit tests for the spec-row coverage, spur-derivation and charge-derivation checks)
        # Same shape as the two discover steps above, for the three spec-side
        # checks added in #237: one grades
        # docs/chipalooza/challenge-5-proposal.md's section-5 table against
        # spec/pll.md's summary table, the second re-derives spec/pll.md's
        # reference-spur arithmetic from its own ingredients, and the third
        # re-derives that arithmetic's own charge totals from
        # sim/mc-cp-mismatch's committed raw samples. Every test builds a
        # throwaway tree and runs the real script in it -- no PDK, no
        # KLayout, no simulation input.
        run: python3 -m unittest discover -s spec/tests -t spec/tests

      - name: design/tests (unit tests for the I/O-list and port-connectivity checks)
        # Same shape again, for the two design-side checks: #237's, which
        # grades docs/chipalooza/challenge-5-proposal.md's section-2.2 pad
        # table and section-4 bench plan against design/netlist/pll_top.spice's
        # own `.subckt pll_top` port list, and #515's, which grades a netlist
        # against ITSELF (a declared port nothing inside the subcircuit wires).
        # Every test builds a throwaway tree -- one miniature netlist, one
        # miniature proposal -- and runs the real script in it; no xschem, no
        # PDK, no simulation input.
        run: python3 -m unittest discover -s design/tests -t design/tests

      - name: sim/lib/check-readme-status.sh (README evidence counts vs. sim/ tree)
        # README.md's status section hand-states a record/campaign count
        # (issue #117: it drifted silently to a stale "16 records / 9
        # campaigns" while the tree grew to 52/18). Pure file-count vs.
        # grep, no PDK dependency -- fails the build the next time it drifts
        # instead of misleading a reader. Every occurrence of each count in
        # README.md is graded as of #237, not only the first: the
        # period-jitter coverage rule in the same script already worked that
        # way, but these two used `head -1`, so a contradicting sibling count
        # further down the file would have passed -- the same gap #495 closed
        # on the layout side.
        run: bash sim/lib/check-readme-status.sh

      - name: layout/lib/check-layout-status-claims.sh (README + proposal vs. layout/ tree and spec/pll.md)
        # The layout-side counterpart of the sim-side check above (issue
        # #237). README.md and docs/chipalooza/challenge-5-proposal.md both
        # stated that no PLL block had been drawn for about five weeks after
        # all four sub-blocks landed with committed GDS and DRC-clean deck
        # output -- and the proposal is a document written to be emailed
        # verbatim to an outside reader. Pure file-existence plus a grep of
        # the recorded deck verdicts; no PDK, no KLayout, no layout input.
        # Also grades every absence-of-layout sentence in both documents for
        # a stated scope, and their claims about spec/pll.md's ratification
        # state against the spec's own Status line -- both of which went
        # stale in the same document after the first pass of this check
        # shipped. Third pass grades the numbers too: every block footprint
        # stated in either document must equal that block's row in
        # layout/evidence/area-audit/area-audit.md, and the proposal must
        # state one for every block the audit records -- section 6's table
        # had drifted two geometry changes behind section 5 of the same
        # document. Fourth pass grades every occurrence of a "N of the 4
        # ..." drawn/LVS-matched count, not just whether the correct one
        # appears once -- the commit that fixed section 6's count left a
        # contradicting stale count in section 3 of the same document, and
        # the presence-only check reported OK on that tree. Fifth pass grades
        # spec/pll.md's own "## Area" section against the same audit --
        # DR-016/DR-017's 0.30 mm2 budget row is amended against these exact
        # numbers, which had never been graded anywhere, only the two status
        # documents' copies of them. Scoped to that one section: the loop
        # filter's C2 plate size elsewhere in the file is stated in the same
        # "W x H um" shape and is not a block footprint. Needs python3 (set
        # up above) for the prose and footprint rules; still reads only
        # committed files, no PDK, no KLayout.
        run: bash layout/lib/check-layout-status-claims.sh

      - name: Install klt (klayout-tools) for the signoff tier check
        # Pinned, for the same reason xschem and the PDK are pinned below: an
        # unpinned klt would re-render signoff/tier-report.json differently the
        # day upstream changes the report shape, failing a PR that touched
        # nothing related. Bump deliberately, re-render the report
        # (`bash signoff/run-signoff.sh`), and read the diff.
        #
        # This is the pip wheel of https://github.com/2AMLogic/klayout-tools;
        # the tier-report check below needs no PDK, no KLayout app binary, and
        # no layout input -- it only reads JSON and Markdown.
        #
        # This is this step's own source of truth for which klt version a
        # local `bash signoff/run-signoff.sh --check` must be run against --
        # see signoff/README.md's "Reproducing" section.
        run: pip install 'klayout-tools==0.6.0'

      - name: signoff/run-signoff.sh --check (T1 tier verdict vs. the committed report)
        # signoff/tier-report.json is this block's T1 verdict of record --
        # machine-rendered by `klt signoff --manifest`, never hand-maintained
        # (see signoff/README.md). Re-rendering it here is what stops it
        # rotting: an evidence artifact that changed after the manifest pinned
        # its content_hash re-grades as unmet/stale_evidence, the committed
        # report stops matching, and this step fails instead of a stale green
        # row surviving.
        run: bash signoff/run-signoff.sh --check

      - name: sim/lib/check-characterization-coverage.sh (aggregated report vs. sim/ tree)
        # #147's sim/CHARACTERIZATION.md is hand-maintained and pulls a
        # headline result from every sim/*/records/ campaign directory.
        # Fails the build if a new campaign directory lands without a
        # matching entry in the report, instead of the aggregation silently
        # going stale. Second pass (#237) grades the report's own count of
        # what it aggregates, not just whether each row is present: the
        # bullet stating "N campaign directories, M evidence records" spent
        # six weeks describing a tree 19 records and 3 campaigns smaller,
        # and asserting that README's already-graded line agreed with it --
        # a claim the row-coverage rule cannot see. Every occurrence of the
        # count is graded, wherever it sits, and one must be present;
        # a figure explicitly marked as the report's original writing is
        # exempt. Needs python3 (set up above) for the count rule; still
        # reads only committed files, no PDK dependency.
        run: bash sim/lib/check-characterization-coverage.sh

      - name: sim/lib/check-record-supersession.sh (cited evidence vs. the sim/ supersession graph)
        # The three checks above all grade what a document *says*. None of
        # them grades whether the evidence it *cites* is still the current
        # evidence (issue #237). sim/README.md deliberately gives a
        # superseded record no back-reference -- "Standing is found by
        # reading forward from the superseded record" -- and nothing ran
        # that forward scan, so docs/chipalooza/challenge-5-proposal.md, the
        # document written to be sent verbatim to an outside reader,
        # described the period-jitter campaign's one FAIL as a live open
        # defect for 18 days after issue #273 closed and a successor record
        # recorded both affected points as PASS. Three more of its citations
        # pointed at pre-sim/harness records whose migrated successors it
        # never named. Two rules: every cited record id must exist on the
        # tree, and a cited record some later record supersedes must have a
        # successor named somewhere in the same document (which, because
        # naming one is itself a citation, means following a chain to a
        # current record). spec/pll.md is deliberately not graded -- DR-007
        # Amendment A4 already governs its one stale citation with a
        # reasoned, ratified carve-out; see the script header. Needs python3
        # (set up above); reads only committed Markdown, no PDK.
        run: bash sim/lib/check-record-supersession.sh

      - name: spec/lib/check-spec-row-coverage.sh (proposal section 5 vs. spec/pll.md's summary table)
        # The four checks above all grade something a document *has* -- its
        # counts, its rows against the sim/ tree, its citations, its layout
        # claims. None can see a spec row a document does not mention at all,
        # and #237's acceptance criteria require exactly that: every spec row
        # "either closed or explicitly marked unmet -- not silently omitted
        # from the table". One was omitted for the proposal's whole life:
        # spec/pll.md's summary-table row 2, Reference input, whose levels and
        # edge rate are unmeasured `budget` items with a Verification-owed line
        # of their own, and which carries the ideal-reference exclusion every
        # jitter and spur number in section 5 rests on. None of it reached the
        # document written to be emailed verbatim to an outside reader. Three
        # rules: every spec summary-table row is named by some section-5 row,
        # at least one row covering it states an explicit verdict, and no
        # section-5 row names a parameter the specification does not have (so
        # a spec rename cannot leave a stale row looking like coverage).
        #
        # Two more rules grade whether a present row reports the row the spec
        # *currently* has: every decision record (DR-NNN) a spec summary-table
        # row cites must be named by a section-5 row covering it, and every
        # DR-NNN the proposal names must be exactly one record on disk. The
        # first found three rows reporting readings the spec had moved past:
        # Lock time as a bare MET without DR-012 (its Lock criterion is not
        # reached at 2 of 45 corners), Area still describing the re-amendment
        # trigger DR-017 replaced, and Reference spur without DR-018's
        # re-priced 1.6 dB margin. Needs python3 (set up above); reads only
        # committed Markdown, no PDK.
        run: bash spec/lib/check-spec-row-coverage.sh

      - name: spec/lib/check-spur-derivation-arithmetic.sh (the reference-spur derivation vs. its own ingredients)
        # check-quoted-value-provenance.sh below grades a *measured* figure by
        # reducing a committed per-corner CSV. Reference spur is the one row of
        # the proposal whose verdict turns on a *derived* number instead: the
        # closed-loop campaign measures 5 of 45 PVT points, all at 150 MHz with
        # device mismatch off, so what the document tells an outside reader
        # about the binding 200 MHz point -- "1.6 dB inside the line" rather
        # than the ~6 dB the older -61 dBc figure implied -- is a hand
        # derivation. That derivation's own section-5.1 entry said it could not
        # be graded because it is "not a reduction of one CSV". It can: every
        # ingredient is written down beside it.
        #
        # Six rules. The derivation must still state the two relations the
        # check implements (read out of the spec, not asserted by the check, so
        # a re-ratification fails here in the same commit); the worst-case sum
        # must be the linear add it calls itself; the step table's chain must
        # follow row by row from its own displayed figures, with the unrounded
        # end-to-end chain agreeing within 0.1 dB so rounding cannot stand in
        # for arithmetic; every charge-accounting row must reproduce its spur
        # from its own total dQ; the measured table's scaled column must add
        # the 20*log10(hi/lo) constant its own header names; and every dBc
        # figure in the proposal must be one the specification contains. Needs
        # python3 (set up above); reads only committed Markdown, no PDK.
        run: bash spec/lib/check-spur-derivation-arithmetic.sh

      - name: spec/lib/check-mismatch-charge-derivation.sh (the reference-spur charge totals vs. their own raw samples)
        # check-spur-derivation-arithmetic.sh above grades the derivation's
        # arithmetic *from* its charge totals (7.93 / 11.19 / 11.66 fC) onward
        # to a dBc figure, and states plainly what it does not grade: where
        # those totals come from, because that needs "a reduction language for
        # a signed |mean| + 3sigma statistic, which it does not have". It does
        # now. Term 1 (DC UP/DN mismatch) and term 3 (residual net charge) are
        # reduced straight from sim/mc-cp-mismatch's committed per-corner
        # samples -- the same worst-of-three-Vctrl-point / worst-corner
        # convention sim/mc-cp-mismatch/testbench/run.sh implements -- and so
        # (since #573) are the other three ingredients: Icp at the trim code
        # DR-018 prices, from sim/cp-compliance's cp_dc.csv; the reset overlap
        # T_ov, from sim/pfd-deadzone's raw_measures.csv; and the systematic
        # per-event charge asymmetry, from sim/cp-compliance's cp_switch.csv.
        # Each uses the campaign's OWN stated reduction, read out of the
        # documents and CSV headers that state it, and DR-018's Input table is
        # graded against the result rather than trusted as the source of it.
        # The three totals the sibling check takes as given are then built
        # from the reduced figures. Needs python3 (set up above); reads only
        # committed Markdown and CSVs, no PDK, no ngspice, no simulation.
        run: bash spec/lib/check-mismatch-charge-derivation.sh

      - name: design/lib/check-io-list-coverage.sh (proposal I/O list vs. the exported port list)
        # The five checks above grade documents against documents, against the
        # sim/ tree, and against the layout/ tree. None grades #237's other
        # AC4 deliverable, the I/O list -- the one whose source of truth is not
        # a document at all but design/netlist/pll_top.spice, the committed
        # export of design/pll_top.sch.
        #
        # The simulation side already refuses to drift from that file:
        # sim/lib/pll_top_dut.sh aborts any closed-loop run whose netlist port
        # list does not match its CLOOP_PORTS, name for name and in order. The
        # document written to be emailed verbatim to an outside reader had no
        # equivalent guard, and it is the one artifact whose reader cannot
        # re-run anything to find out. It drifted once already: PR #418 added
        # LDT0-LDT3 as real top-level ports, and three days later issue #441
        # found section 2.2's pad table still had no row for them -- "the
        # proposal described a part that could not be configured into its own
        # ratified spec" (DR-015) -- with a stale 18-of-24 slot total beside it.
        #
        # Five rules on the pin mapping: every exported port is mapped by a pad
        # row; every signal a pad row names is a real port; the `.subckt
        # pll_top` line the document quotes is the netlist's ports in the
        # netlist's order; a pad row's "K of M" count equals the signals beside
        # it; and every port is named somewhere in section 4's bench test plan.
        # The last of those found the drift DR-015 handed to "future harness
        # integration work" and nobody picked up: the plan named neither
        # LDT0-LDT3 nor the four bias references IBN/ICN/IBP/ICP, so it
        # described a bench that could not power the charge pump and a
        # lock-detector step that compared an untrimmed part against a spec
        # which says such a part is outside it.
        #
        # Four more on the budget accounting, because #441's stale row count
        # came with a stale slot total and a stale configuration-bit sentence
        # two sections away: every pad row's Challenge slot is a category
        # section 2.2's own transcribed budget names (and any cap it quotes is
        # that category's); each category's total equals the sum of the rows
        # carrying it, with "(proposed)" rows counting toward the upper figure
        # of a range only; every transcribed category is totalled somewhere;
        # and section 2.3's "N configuration bits (...)" count is its own bus
        # list expanded, with an omitted pin explained in the same bullet. The
        # taxonomy is read out of the document, never encoded in the check, so
        # amending the transcription moves what CI enforces in the same commit.
        # Those rules found the rail rows sitting in a slot -- "3.3 V digital
        # rail" -- that the budget does not have, with the five supply/ground
        # pads missing from a totals paragraph that claims to cover every
        # category.
        # Needs python3 (set up above); reads one committed netlist and one
        # committed Markdown file, no PDK, no xschem.
        run: bash design/lib/check-io-list-coverage.sh

      - name: design/lib/check-port-connectivity.sh (declared ports vs. what a netlist actually wires)
        # The check above grades a netlist's port list against a DOCUMENT.
        # Issue #515 found the gap on the other side: `design/pll_top.sch`
        # placed the `LDT3` trim label three grid rows off the `XLD`
        # lock-detector instance's real `LDT3` pin, so the exported netlist
        # wired that instance's eighth argument to `net1` -- an xschem
        # auto-named net with exactly one connection -- while `.subckt
        # pll_top` still declared a real `LDT3` port two lines above it.
        # `design/netlist.sh --check` could not catch it: the export was
        # internally consistent with the broken schematic, so there was
        # nothing to diff against. Only 8 of the 16 lock-detector window trim
        # codes were reachable on the assembled part as a result.
        #
        # Two rules, checked against every committed design/netlist/*.spice
        # file: every port a top-level `.subckt` declares must be connected
        # somewhere inside that same subcircuit's own body; and no
        # `net<N>`-shaped auto-named net anywhere in the file may carry
        # exactly one connection -- the mechanically detectable signature a
        # dropped label leaves behind. Needs python3 (set up above); reads
        # only committed `.spice` text, no PDK, no xschem.
        run: bash design/lib/check-port-connectivity.sh

      - name: sim/lib/check-record-trim-connectivity.sh (committed evidence vs. the netlist snapshot it was taken on)
        # The check above stops #515's defect recurring in `design/`. It says
        # nothing about the evidence already taken on the broken export, and
        # DR-026's audit of that -- `grep -rl 'ldt3_code=1' sim/*/corners/*/`
        # -- read as exhaustive and was not. Three `sim/reference-phase-
        # transfer` records (#509) had been run that morning on the same
        # pre-fix netlist while programming trim code 8, so their detector ran
        # at code 0, and they reached `main` after DR-026 merged. That grep
        # could never have returned them: their decks take the code from
        # `testbench/tb.json` through the harness, so the string it looks for
        # appears in none of their logs (#557). A grep for one campaign's
        # parameter spelling is not an audit of a tree.
        #
        # This grades artifacts instead, and needs both halves of the defect:
        # a committed `sim/*/netlist-snapshots/*.spice` that leaves a declared
        # port wired to a single-connection auto-named `net<N>`, AND that same
        # record's own committed per-corner log showing the matching pad
        # driven. Either alone is not a finding -- an unused dead pin changed
        # nothing (`sim/lock-window-proxy`), and a driven pad on a netlist
        # that wires it is every post-DR-026 record. A record that has both
        # must be named in the check's DISCLOSED table against a decision
        # record that exists, is more than a stub, and names the campaign
        # back. Its unit tests run under `bash sim/selftest.sh` above
        # (sim/tests discovery). Needs python3 (set up above); reads committed
        # `.spice` snapshots, committed logs and committed Markdown -- no PDK,
        # no ngspice.
        run: bash sim/lib/check-record-trim-connectivity.sh

      - name: sim/lib/check-pvt-coverage-claims.sh (quoted corners vs. the harness's corner registry)
        # The six checks above all grade WHAT a document says -- its counts, its
        # rows, its citations, its spec and decision-record coverage, its I/O
        # list. None grades WHERE a number was measured, and CLAUDE.md's
        # standing rule for this repository is "PVT corners on every recorded
        # result" (#237 AC1).
        #
        # Section 5 of docs/chipalooza/challenge-5-proposal.md reports most
        # rows against the 45-point mandated grid and says so. Four rows in the
        # same column -- Output band, open-loop period jitter, Power, Kvco --
        # reported worst cases at `all-fast` / `all-slow`, combined bundles
        # that skew every device family together (passives included) and are
        # NOT in that grid: they come from vco-tuning-range's 63-point superset
        # grid, whose own record says so in as many words ("a **superset** of
        # the 45-point default grid"). The document written to be emailed
        # verbatim to an outside reader said none of it, so four rows were read
        # as "of 45" when they were worst cases over a wider corner universe.
        # sim/CHARACTERIZATION.md carried the same undisclosed row, plus
        # "21/135 corners" for what is 135 rows over a 45-corner grid.
        #
        # Four rules: every process bundle a graded document quotes in a
        # corner triple is one sim/harness/corners.py defines; a table row
        # that is off the mandated grid names the grid it came from (an
        # `<N>-point` or `<N>-bundle` token matching the cited record's own
        # committed coverage, and not the mandated numbers, since repeating
        # them discloses nothing); every PVT-qualified corner count in a
        # row is the mandated grid size or a count the cited record's
        # committed per-corner evidence produces; and a row that claims it
        # covers the WHOLE mandated grid cites records whose committed
        # evidence, in union, contains every mandated point.
        #
        # "Off the mandated grid" has two triggers, because the first alone
        # was a disclosure rule keyed on what a row happens to SAY. A row is
        # off the grid if it quotes a corner outside it, OR if a record it
        # cites was MEASURED outside it. The proposal's Lock detector row
        # rests on three campaigns that each run 13 bundles / 117 PVT points
        # and quoted only their `fs` and `ss` corners, so it disclosed
        # nothing; sim/CHARACTERIZATION.md's harness-selftest row called its
        # record's grid "45-point" when that record's own corner field reads
        # "63 point full-factorial grid" -- an error the third rule
        # structurally cannot catch, because it allows the mandated size
        # unconditionally. Five more rows across the two documents were in the
        # same state on 2026-09-25.
        #
        # The fourth rule is the converse of that trigger: it grades evidence
        # NARROWER than the grid a row claims, where trigger (b) grades
        # evidence wider than the grid a row quotes. It is point-by-point, not
        # count-by-count, and it takes the union across every record the row
        # cites -- sim/period-jitter reached the mandated 45 across five
        # records covering 1, 4, 8, 18 and 16 points, so a per-record test
        # would reject the honest row and a count test would accept 45 points
        # that are not the 45. Rule 3 cannot do this job: "5 of 45 PVT points
        # measured, not the full grid" is an honest sentence, so 45 has to
        # stay unconditionally allowed as a denominator, and the cost is that
        # the strongest claim in the table -- I measured all of it -- was the
        # one claim nothing verified. A sweep of all three graded documents on
        # 2026-09-25 found 13 rows making a full-coverage claim; 12 were backed
        # point for point, and sim/CHARACTERIZATION.md's Verification-owed
        # cross-reference cited campaign directories rather than records, so
        # neither a check nor a reader could reach the evidence for it.
        #
        # The mandated size is computed from REQUIRED_MOS_CORNERS x
        # DEFAULT_TEMPERATURES_C x supply_points(), imported rather than
        # written down, so widening an axis moves what CI enforces in the same
        # commit that widens it. Its unit tests run under `bash sim/selftest.sh`
        # above (sim/tests discovery), which is why there is no separate
        # discover step here. Needs python3 (set up above); reads committed
        # Markdown plus the committed CSV/log artifacts under sim/*/corners/.
        # No PDK, no ngspice, no KLayout.
        run: bash sim/lib/check-pvt-coverage-claims.sh

      - name: sim/lib/check-ref-drive-claims.sh (quoted reproduction commands vs. the decks they promise)
        # The seven checks above grade what a document says, where it was
        # measured, what it cites, and what the forge holds. None grades the
        # one thing a document can offer that looks strongest of all: a shell
        # command the reader is invited to run.
        #
        # docs/chipalooza/challenge-5-proposal.md's Reference input row and
        # spec/decision-records/DR-019's Context both rested on
        # `grep -n '^vref ' sim/*/testbench/*.sp` returning one reference
        # waveform shape in every deck -- the basis for the claim that the
        # ratified Reference input contract's levels, edge rate and duty are
        # conditions nothing has ever varied, and with it for every jitter and
        # spur number in the document being the block's own contribution
        # against an ideal reference. The command did return one shape. This
        # repository held thirteen REF-driving decks, and the one that varies
        # the waveform is `.spice` while the glob says `*.sp` -- so the command
        # quoted as proof could not return the counterexample, which had landed
        # in the same commit (#518, issue #499) that wrote both sentences.
        #
        # Five rules: the deck scan must find decks at all; a quoted command's
        # glob may not be outreached by its own pattern (only the extension is
        # relaxed, never the directory); a deviating deck must be named by any
        # document claiming uniformity; an unscoped uniformity claim must hold
        # over every deck its command can reach, union the widening, so
        # re-narrowing the glob is not a way out; and -- the rule that needs no
        # wording at all -- a deck that varies the reference waveform must
        # carry no record. Its unit tests run under `bash sim/selftest.sh`
        # above (sim/tests discovery). Needs python3 (set up above); reads
        # committed SPICE decks and committed Markdown, no PDK, no ngspice.
        run: bash sim/lib/check-ref-drive-claims.sh

      - name: sim/lib/check-bias-drive-claims.sh (bias-pin drive and quoted Limitations vs. the decks and records)
        # The PLL has no bias generator: every closed-loop deck drives
        # IBN/ICN/IBP/ICP from ideal current sources, and the proposal turns
        # that into a bench instruction (section 4 step 1: what current, into
        # which pin, set where) and a pad-table justification (section 2.2:
        # a phrase quoted "verbatim" from the records' Limitations). Both
        # cited evidence and neither was graded. Step 1 sent the reader to a
        # `.param iunit=8u` line tb_lock_time.sp does not contain -- its value
        # comes from run.sh -- and section 2.2 attributed its quotation to
        # every closed-loop record when 7 of 35 say it.
        #
        # Five rules: every campaign a drive claim cites runs at the stated
        # current; every path it cites is where the quoted setting actually
        # lives for the decks it stands for; quoted source lines and the
        # stated sourced/sunk polarity match the decks; "every closed-loop
        # record" holds over every closed-loop deck, cited or not; and a
        # verbatim quotation is in every record it is attributed to. Its unit
        # tests run under `bash sim/selftest.sh` above (sim/tests discovery).
        # Needs python3 (set up above); reads committed decks, testbench
        # scripts, tb.json manifests and records -- no PDK, no ngspice.
        run: bash sim/lib/check-bias-drive-claims.sh

      - name: sim/lib/check-quoted-value-provenance.sh (quoted values vs. the committed per-corner evidence)
        # Every check above grades something *about* a number -- its count, its
        # citation and whether that citation is current, its grid, its verdict,
        # its reproduction command, its forge reference. None graded THE NUMBER.
        # So a section 5 row could cite the right record, name the right grid,
        # carry the right verdict, and quote a figure that is not in that
        # record at all -- or was right once and drifted when a superseding run
        # moved it -- and nothing in this job would have seen it. #237's own
        # ledger named the gap on 2026-09-25 and verified a sample by hand; a
        # hand check is not a check.
        #
        # Section 5.1 of the proposal is the convention this grades: for each
        # value, the record, the committed evidence file inside it, the
        # reduction that produces it, and the scale. Seven rules: the record and
        # file are committed; the record is one the section 5 row itself cites
        # (or inherits via "Same record"); the figure appears verbatim in that
        # row, so the two tables cannot drift apart in either direction; the
        # re-derived value equals the figure ROUNDED TO THE PRECISION WRITTEN;
        # every section 5 row is either graded or carries a stated reason why
        # it has no re-derivable value -- the same "nothing is silently
        # omitted" rule section 5 already applies to verdicts; and every
        # headline figure section 5.1 declares ungraded INSIDE a graded row
        # still appears verbatim in that row, is not also graded, and gives a
        # reason. That last rule replaced prose which had already gone wrong:
        # it named four ungraded figures and silently missed a fifth (the
        # output band row's `27 %` worst adjacent-band overlap).
        #
        # Two figures in that row are properties of an ordered CURVE rather
        # than reductions of cells, and the grammar carries a group-sequence
        # form for them -- `count(non-monotonic(fosc_hz by vctrl_v) by ...)`
        # and `min(adjacent-overlap(fosc_hz by band) by ...)`. The first
        # grades a ZERO, so the check treats an empty group set, a one-point
        # curve and a repeated control voltage as failures rather than passes,
        # and prints the number of groups it examined. The second pairs `band`
        # with `band+1`, so a GAP in a corner's band codes (`0, 1, 3`) is a
        # failure too rather than a pair the walk steps over (#566): a worst
        # overlap says nothing about how many intervals it was the worst of,
        # so the count of adjacent pairs examined is printed beside the group
        # count for the same anti-vacuity reason.
        #
        # One figure is a STATISTIC rather than an extremum -- the reference
        # spur row's term-1 mismatch reading, 17.48 % -- and the grammar
        # carries a `sig3` aggregate (`|mean| + 3*sigma`, sample sigma) and a
        # `worst-magnitude` group verb for it, composed three deep:
        # `max(sig3(worst-magnitude(mism_pct by vctrl_v) by seed) by corner)`.
        # Every level matters and collapsing one makes the number SMALLER
        # (13.2172 % folded, 10.94 % pooled-and-folded, against 17.4798 %
        # signed), which is exactly the drift DR-018 Amendment A1 corrected --
        # so the tests for it assert that each collapsed reading FAILS.
        #
        # The contracted-space figures (loop bandwidth, phase margin, settling)
        # are selected by an `on-icp-trim-rule` predicate READ OUT OF
        # spec/pll.md's normative Icp trim-code rule table, never written into
        # the check, so a change to the ratified rule moves what CI enforces in
        # the same commit.
        #
        # Evidence is not only a CSV, as of 2026-09-26. Three section 5 rows
        # were ungraded for the reason "no reduced CSV was committed, so the
        # count cannot be re-derived" -- the two closed-loop rows in the
        # exclusion table and the multiplication-ratio figures in the
        # ungraded-figure table -- and all three records had committed their
        # full per-point table all along, in the record's own Markdown
        # (sim/output-range 90 rows, sim/lock-time 270, sim/divider-ratio-chain
        # 235). "No CSV" had been read as "no evidence" three times. So an
        # entry may name `<record-id>.md § <first column>` and reduce that
        # table, under one rule a CSV does not need: the table must have exactly
        # one row per committed per-corner log, and where its first column is
        # the per-corner point id the row SETS are compared too -- a truncated
        # or hand-trimmed table must not read as a smaller, passing count. The
        # logs are read as NAMES only; this check still never parses a logfile's
        # contents.
        #
        # And evidence is not the only ingredient, as of 2026-09-26. Two
        # figures are a measurement divided by a RATIFIED LINE -- `1.41x`, the
        # worst measured VCTRL travel over the 0.6 V Budget 2 allows, and
        # `47 %`, the same travel over the 1.8 V width of DR-003 Decision 5's
        # measured control window. Both sat in the ungraded-figure table for
        # the reason "a ratio to a spec line is arithmetic on the line, not a
        # column of the committed evidence": true about the column, wrong
        # about the conclusion, in exactly the way section 5.2's spur
        # derivation had already shown -- a hand derivation is gradeable when
        # every ingredient is written down. A third table in section 5.1
        # grades them, with the constants READ out of spec/pll.md and DR-003
        # (never written into the check), each required to be stated at least
        # twice and to agree between those statements, and with the table's
        # own statement of the constant graded against what was read.
        #
        # One guard arrived with it that the first table needed too: A RANGE
        # IS NOT A FIGURE. The figure parser reads the number at the front of
        # the string, so a quoted `0.1-0.5 dB` would have been graded as `0.1`
        # and the other end never looked at -- grading half of a two-sided
        # bound and calling it the bound, which is the named defect the
        # ungraded list exists to make visible. Range-shaped figures are now
        # refused in both grading tables.
        #
        # Its unit tests run under `bash sim/selftest.sh`
        # above (sim/tests discovery). Needs python3 (set up above); reduces
        # committed CSVs and in-record tables only -- no PDK, no ngspice, no
        # network.
        run: bash sim/lib/check-quoted-value-provenance.sh

      - name: docs/tests (unit tests for the issue-reference-state check)
        # Same shape as the three discover steps above, for the check added in
        # #237 that grades what the outward-facing documents claim about the
        # forge. Hermetic despite the check itself needing the forge: every
        # test puts a stub `gh` first on PATH, so the issue states are part of
        # the fixture. No network, no token, no PDK.
        run: python3 -m unittest discover -s docs/tests -t docs/tests

      - name: docs/lib/check-issue-reference-state.sh (issue references vs. the forge)
        # The seven checks above grade documents against the tree. This one
        # grades the other half of what docs/chipalooza/challenge-5-proposal.md
        # and README.md assert -- their claims about the *forge*: "Tracked at
        # issue #13", "issue #499 (open)", "routed to their owning issues (#9,
        # #10, #11)". Nothing in the tree changes when an issue closes, so no
        # tree-reading check could see those rot, and they did: #13 and #17
        # both closed on 2026-09-08 and were still named as live owners
        # seventeen days later; #9/#10/#11 were all closed while the proposal
        # told its reader they owned three FAILing supply-sensitivity
        # criteria; and `Epic #542` never resolved in this repository at all,
        # i.e. it was a 404 for the outside reader this document is written to
        # be emailed to.
        #
        # Four rules: every `#N` resolves here; an annotated state (`(open)` /
        # `is closed`) matches the forge; a present-tense owner ("tracked at",
        # "routed to", "filed as", "owed at", "owned at") is OPEN, past-tense
        # narration exempt; and a section-5 Source-column issue carries an
        # explicit state annotation. sim/README.md and sim/CHARACTERIZATION.md
        # are graded too: both named the closed #505 as the live owner of the
        # random period-jitter component ("owed at", "owned at") after DR-023
        # re-pointed it at #520, and CHARACTERIZATION.md told its reader that
        # klayout-tools #309 "remains open" six weeks after it shipped.
        #
        # THIS IS THE ONLY CHECK HERE THAT IS NOT DETERMINISTIC ON A TREE, by
        # necessity -- the fact it grades lives on the forge. Two consequences,
        # both intended: it SKIPS (exit 0, saying "a skip is not a pass") when
        # `gh` cannot answer, and it can fail a PR that changed nothing because
        # someone closed a cited issue. The document went stale at that moment,
        # not at the moment someone next edited it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash docs/lib/check-issue-reference-state.sh

  design-changed:
    name: design-changed (path filter for pdk-checks)
    runs-on: ubuntu-latest
    # Per-job path filter for pdk-checks below. GitHub Actions has no per-job
    # `paths:` key, and a workflow-level `paths:` on the pull_request trigger
    # would gate the headless `checks` job too -- so ask the API which files
    # the PR touches. No checkout, no PDK, a couple of seconds.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      design: ${{ steps.filter.outputs.design }}
    steps:
      - name: Does this PR touch design/?
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_FILES_API: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        run: |
          set -uo pipefail
          # Fail open: if the file list can't be read, report design=true so
          # pdk-checks still runs. A missed netlist-drift check is the failure
          # this job exists to prevent; a redundant PDK install is only slow.
          if ! files="$(gh api --paginate "$PR_FILES_API" --jq '.[].filename')"; then
            echo "Could not list the PR's changed files -- failing open (design=true)." >&2
            echo "design=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -q '^design/'; then
            echo "design=true" >> "$GITHUB_OUTPUT"
          else
            echo "design=false" >> "$GITHUB_OUTPUT"
          fi

  pdk-checks:
    name: pdk-checks (design/ PRs, nightly, ci:full -- requires gf180mcu PDK + xschem)
    runs-on: ubuntu-latest
    needs: [design-changed]
    # `!cancelled()` is load-bearing: design-changed is skipped on schedule /
    # workflow_dispatch runs, and a skipped `needs` job cascades a skip here
    # unless the condition uses a status-check function.
    #
    # The PR arm reads `!= 'false'` rather than `== 'true'` so that a
    # design-changed job which failed outright (empty output) also falls open
    # to running these checks, matching the fail-open behaviour of its script.
    if: >-
      !cancelled() &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        (needs.design-changed.outputs.design != 'false' ||
         contains(github.event.pull_request.labels.*.name, 'ci:full'))))
    env:
      # #421: pin xschem to the commit the `3.4.7` tag points at -- every
      # committed design/netlist/*.spice export was generated with 3.4.7, and
      # apt's xschem package drifts with the distro (3.4.4 on ubuntu-latest/
      # noble as of 2026-09). A commit, unlike a tag, cannot move; verify at
      # https://github.com/StefanSchippers/xschem/releases/tag/3.4.7 before
      # bumping.
      XSCHEM_COMMIT: 92dd8fe5f4d5c1057489710d8a22f18fdc9d7ed0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ngspice and xschem's runtime/build dependencies
        run: |
          sudo apt-get update
          # ngspice: unpinned, apt's version tracks whatever this runner's
          # Ubuntu ships. xschem is deliberately NOT installed from apt here
          # (see the pinned build below) -- apt's xschem tracks the distro
          # package too, which is exactly the drift #421 is about.
          sudo apt-get install -y ngspice \
            flex bison gawk tcl tcl-dev tk tk-dev \
            libcairo2 libcairo2-dev xcb libxcb1 libxcb1-dev libxrender-dev \
            libxpm-dev libxcb-render0-dev libx11-xcb1 libx11-xcb-dev

      - name: Cache xschem 3.4.7 build
        id: cache-xschem
        uses: actions/cache@v4
        with:
          path: /tmp/xschem-src
          key: xschem-${{ env.XSCHEM_COMMIT }}-${{ runner.os }}-v1

      - name: Build xschem 3.4.7 from source (pinned)
        # #421: the runner's `apt-get install -y xschem` resolves to whatever
        # Ubuntu ships (3.4.4 on noble as of 2026-09), while every committed
        # design/netlist/*.spice export was generated with 3.4.7 -- a version
        # mismatch this script's provenance banner and continuation-line
        # wrapping both surface as false STALE / leaf-cell-collision failures
        # (see design/netlist.sh's XSCHEM_VERSION stamp and check_export's
        # wrapped-port-list guard). Pinned to the exact commit the `3.4.7` tag
        # points at (not just the tag name) for the same reason the PDK below
        # is pinned to a hash rather than a branch: a tag can move, a commit
        # cannot. Build steps mirror xschem's own CI:
        # https://github.com/StefanSchippers/xschem/blob/3.4.7/.github/workflows/ci.yaml
        if: steps.cache-xschem.outputs.cache-hit != 'true'
        run: |
          rm -rf /tmp/xschem-src
          mkdir -p /tmp/xschem-src
          cd /tmp/xschem-src
          git init -q
          git remote add origin https://github.com/StefanSchippers/xschem.git
          git fetch --depth 1 origin "${XSCHEM_COMMIT}"
          git checkout -q FETCH_HEAD
          ./configure
          make -j"$(nproc)"

      - name: Install xschem 3.4.7
        run: sudo make -C /tmp/xschem-src install

      - name: Confirm the pinned xschem version is on PATH
        # Cheap guard against the exact failure mode #421 filed: if apt's
        # xschem (or any other build) shadows the pinned one on PATH, fail
        # loudly here instead of producing a confusing STALE/collision
        # failure three steps later.
        run: |
          version="$(xschem --no_x -q --version 2>/dev/null | head -1)"
          echo "xschem on PATH: $(command -v xschem) ($version)"
          case "$version" in
            *3.4.7*) ;;
            *) echo "ERROR: expected xschem 3.4.7 (pinned commit ${XSCHEM_COMMIT}), got: $version" >&2
               exit 1 ;;
          esac

      - name: Install the gf180mcu PDK via volare
        run: |
          pip install --user volare
          # Pinned to the open_pdks hash this repo's evidence records cite
          # (see sim/README.md). volare installs into ~/.volare/gf180mcuD,
          # which sim/harness/pdk.py and design/xschemrc both search by
          # default -- no extra env var needed.
          "$HOME/.local/bin/volare" enable --pdk gf180mcu c6d73a35f524070e85faff4a6a9eef49553ebc2b

      - name: design/netlist.sh --check-paths
        run: ./design/netlist.sh --check-paths

      - name: design/netlist.sh --check
        run: ./design/netlist.sh --check

      - name: sim/selftest.sh --require-pdk
        # Fails loudly instead of skipping if the PDK turns out to be
        # missing here too -- catches a broken nightly runner rather than
        # reporting a false pass.
        run: bash sim/selftest.sh --require-pdk

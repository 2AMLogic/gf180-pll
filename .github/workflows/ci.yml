name: CI

# The required headless tier lives here; the PDK-dependent tier lives in
# pdk-checks.yml. Two files, because the checks this repo already has do not
# share a toolchain dependency AND because of how GitHub fires workflows on
# label adds (issue #1015):
#
#   checks       -- headless. No PDK, no xschem, no GUI. Runs on every
#                   push/PR so a broken harness or a bad Python change is
#                   caught immediately, in a bare runner with no extra
#                   install step. This file's pull_request trigger does NOT
#                   include `labeled`: GitHub re-runs a whole workflow on
#                   ANY label add, so a `labeled` entry here re-ran the full
#                   ~4-minute suite on a head that had usually already
#                   passed it, parking review on a pending re-run of a run
#                   measured at 3m08s-3m49s on the identical tree. With
#                   `labeled` absent, a label add creates no run of this
#                   workflow at all, so the `checks` conclusion on a head
#                   always comes from that head's own opened/synchronize
#                   run: a red head stays red and a green head stays green,
#                   whatever labels land on the PR afterwards. (A per-job
#                   skip instead of the trigger split was measured and
#                   rejected on #1015: a skipped context counts as green in
#                   GitHub's rollup, in merge-pr's required-context gate and
#                   in the Judge's exact-head CI gate alike, so a label add
#                   on a red head flipped all three to clean -- UNSTABLE to
#                   CLEAN on the forge, LOOM-CHECKS-GREEN from wait-checks.)
#   pdk-checks   -- requires the gf180mcu PDK (via ciel) and xschem on
#                   PATH. These catch netlist drift against the committed
#                   schematics, which only matters when design/ changes and
#                   is not worth an install step on every PR. So it runs on
#                   the nightly schedule, on manual dispatch, and on any PR
#                   that touches design/ -- the latter detected by the
#                   design-changed job in pdk-checks.yml, because GitHub
#                   Actions has no per-job `paths:` filter. The `ci:full`
#                   label (declared in .github/labels.yml) forces it on for
#                   a PR that leaves design/ alone, e.g. one editing
#                   design/netlist.sh's callers, this workflow, or the PDK
#                   pin. Both jobs live with their `labeled` trigger in
#                   pdk-checks.yml, gated to skip on every label add except
#                   ci:full -- so label writes cost seconds, never a PDK
#                   install. Job names in both files are the
#                   required-status-check context names, so the split moves
#                   no context a branch rule may list.
#
# Self-checks intentionally NOT wired here:
#   - sim/run-all.sh, sim/lib/simenv.sh, and the per-campaign
#     sim/*/testbench/run.sh scripts are full PVT campaign runners invoked
#     by run_corners.py / selftest.sh, not standalone CI smoke checks --
#     see the "checks" job below and pdk-checks.yml's jobs for what those
#     exercise. (simenv.sh's own bash regression tests,
#     sim/lib/test_simenv_*.sh, ARE wired: see the "checks" job's step for
#     them.)

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` is deliberately absent -- see the header comment. A label add
    # must not re-run this workflow's required `checks` context; the ci:full
    # opt-in lives in pdk-checks.yml, the only workflow listening for label
    # adds.
    types: [opened, synchronize, reopened]
  schedule:
    # Nightly headless run. The PDK-dependent half of the nightly lives in
    # pdk-checks.yml (same cron), which is also why this tier is not on
    # every push/PR.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

jobs:
  checks:
    name: checks (headless -- no PDK/xschem)
    runs-on: ubuntu-latest
    # Label adds do not reach this workflow at all (`labeled` is not in the
    # pull_request types -- see the header comment), so this job runs exactly
    # once per head: its opened/synchronize run.
    #
    # Toolchain contract shared by every claim-checker step below, stated once
    # here instead of seventeen times: each checker needs only python3 (set up
    # above) and reads committed text/CSV/JSON evidence -- no PDK, no ngspice,
    # no xschem, no standalone KLayout application binary. The single
    # exception is layout/lib/check-layout-status-claims.sh's layer-census
    # rule, which imports klayout.db from the `klayout` pip wheel installed
    # above, and only when a graded document states a census.
    #
    # Per-checker rationale lives in each script's own header and its row in
    # docs/claim-checker-inventory.md, not in a per-step comment. Checker unit
    # tests under sim/tests/ run via the sim/selftest.sh step -- which is why
    # there is no separate sim/tests discover step in this job.
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: layout/lib/check-evidence-host-paths.sh diffs the PR
          # against its merge base with the default branch.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # Pinned, not "3.x": a floating version outran the klayout wheels
          # (none for cp315), forcing a failing sdist build.
          python-version: "3.13"

      - name: Install the klayout pip wheel (klayout.db -- not the standalone app binary)
        # This is the `klayout` PyPI package providing `klayout.db`, distinct
        # from the standalone KLayout application binary used for DRC/LVS
        # decks (see layout/README.md -- "The two KLayouts"). It needs no
        # PDK, no xschem, and no extra system libs on ubuntu-latest, so it's
        # cheap to install on every PR. Installing it here is what flips the
        # layout/tests/*.py tests below from `@unittest.skipUnless(HAVE_KLAYOUT,
        # ...)`-skipped to actually run/pass in this job (issue #349) --
        # without it every such test (including the VCO n-well geometric
        # verification gate added in #339/#345) silently never executes.
        run: pip install klayout

      - name: sim/selftest.sh
        # Default mode: harness unit tests always run (no PDK needed). The
        # end-to-end PVT smoke stage self-skips with exit 0 when ngspice /
        # the gf180mcu PDK are absent (which they are on this runner) --
        # see sim/selftest.sh. Do NOT pass --require-pdk here.
        run: bash sim/selftest.sh

      - name: sim/lib/test_simenv_*.sh (bash regression tests for sim/lib/simenv.sh)
        # Thread-count / ngspice-pin / deck-retry logic in simenv.sh. Headless:
        # detection takes injected ldd output, so no ngspice or PDK is needed.
        # The glob picks up any new test_simenv_*.sh automatically;
        # test_helpers.sh is shared scaffolding, not a test, and is excluded
        # by the pattern. Every script runs even after a failure so one run
        # reports all of them, and the step fails if any did.
        run: |
          rc=0
          for t in sim/lib/test_simenv_*.sh; do
            echo "=== $t"
            bash "$t" || { echo "FAILED: $t"; rc=1; }
          done
          exit "$rc"

      - name: "sim/lib/check-artifact-manifests.sh (artifact manifests: schema, artifact: URIs, no committed bytes)"
        # Why: the script's own header and its docs/claim-checker-inventory.md row.
        run: bash sim/lib/check-artifact-manifests.sh

      - name: layout/tests (harness unit tests + klayout.db-gated tests)
        # layout/harness/drc.py's two pure functions (parse_report_db,
        # rules_from_log) have zero PDK/KLayout dependency and always ran
        # here. With the klayout pip wheel installed above, the
        # `@unittest.skipUnless(HAVE_KLAYOUT, ...)`-gated tests across
        # layout/tests/ (e.g. test_vco_layout.py, test_divider_chain.py,
        # test_cp_leg_devgen.py) now run too. lvs.py and faults.py's
        # subprocess-driving functions (the standalone KLayout app binary,
        # DRC/LVS decks) are still not covered here -- those require the
        # full PDK toolchain and belong in pdk-checks, not this headless job.
        run: python3 -m unittest discover -s layout/tests -t layout/tests

      - name: spec/tests (unit tests for the spec-row coverage, spur-derivation and charge-derivation checks)
        # Same shape as the two discover steps above, for the three spec-side
        # checks added in #237: one grades
        # docs/chipalooza/challenge-5-proposal.md's section-5 table against
        # spec/pll.md's summary table, the second re-derives spec/pll.md's
        # reference-spur arithmetic from its own ingredients, and the third
        # re-derives that arithmetic's own charge totals from
        # sim/mc-cp-mismatch's committed raw samples. Every test builds a
        # throwaway tree and runs the real script in it -- no PDK, no
        # KLayout, no simulation input.
        run: python3 -m unittest discover -s spec/tests -t spec/tests

      - name: design/tests (unit tests for the I/O-list and port-connectivity checks)
        # Same shape again, for the two design-side checks: #237's, which
        # grades docs/chipalooza/challenge-5-proposal.md's section-2.2 pad
        # table and section-4 bench plan against design/netlist/pll_top.spice's
        # own `.subckt pll_top` port list, and #515's, which grades a netlist
        # against ITSELF (a declared port nothing inside the subcircuit wires).
        # Every test builds a throwaway tree -- one miniature netlist, one
        # miniature proposal -- and runs the real script in it; no xschem, no
        # PDK, no simulation input.
        run: python3 -m unittest discover -s design/tests -t design/tests

      - name: sim/lib/check-readme-status.sh (README evidence counts vs. sim/ tree)
        # Why: the script's own header and its docs/claim-checker-inventory.md row.
        run: bash sim/lib/check-readme-status.sh

      - name: layout/lib/check-layout-status-claims.sh (README + proposal vs. layout/ tree and spec/pll.md)
        # Why: the script's own header and its docs/claim-checker-inventory.md row.
        run: bash layout/lib/check-layout-status-claims.sh

      - name: layout/lib/gen_layout_status_table.py --check (generated status table vs. layout/evidence/)
        # layout/STATUS.md carries the per-sub-block drawn / DRC-clean /
        # LVS-matched counts, footprints, the assembled-pll_top sentinel and
        # the KLayout pin as a table generated from the evidence tree (issue
        # #812). Regenerates in memory and fails with a diff if the committed
        # copy differs, replacing the prose-attributing count, pin-restatement
        # and README-footprint rules the checker above used to carry. Pure
        # file reads; no PDK, no KLayout.
        run: python3 layout/lib/gen_layout_status_table.py --check

      - name: signoff/tests (unit tests for run-signoff.sh's klt version pin)
        # Same shape as the three discover steps above, for the signoff-side
        # check added in #630: run-signoff.sh used to check only that `klt`
        # was *present*, so a post-tag source build (`0.6.0+g<sha>`) rendered
        # a report whose `build` block no pinned-wheel host reproduces, and
        # `--check` reported a current tier-report.json as stale. The script
        # now reads the pin out of the "Install klt" step below -- never
        # restating it -- and requires an exact `klt <pin>` match. Every test
        # builds a throwaway tree with a stub `klt` on PATH reporting a
        # version of its choosing, so this runs before klt is installed and
        # needs neither the real tool nor a PDK.
        run: python3 -m unittest discover -s signoff/tests -t signoff/tests

      - name: signoff/t1_attest.py --check (T1 item 1/9/10 inventories vs. the tree)
        # The inventories under signoff/attest/ pin design sources, testbenches
        # and repo-hygiene files by content hash; the klt grader only re-hashes
        # the inventory itself. This stdlib check is what makes editing an
        # inventoried file fail CI until the attestation is regenerated.
        run: python3 signoff/t1_attest.py --check

      - name: Install klt (klayout-tools) for the signoff tier check
        # Pinned, for the same reason xschem and the PDK are pinned below: an
        # unpinned klt would re-render signoff/tier-report.json differently the
        # day upstream changes the report shape, failing a PR that touched
        # nothing related. Bump deliberately, re-render the report
        # (`bash signoff/run-signoff.sh`), and read the diff.
        #
        # This is the pip wheel of https://github.com/2AMLogic/klayout-tools;
        # the tier-report check below needs no PDK, no KLayout app binary, and
        # no layout input -- it only reads JSON and Markdown.
        #
        # This is this step's own source of truth for which klt version a
        # local `bash signoff/run-signoff.sh --check` must be run against --
        # see signoff/README.md's "Reproducing" section.
        run: pip install 'klayout-tools==0.8.0'

      - name: signoff/run-signoff.sh --check (T1 tier verdict vs. the committed report)
        # signoff/tier-report.json is this block's T1 verdict of record --
        # machine-rendered by `klt signoff --manifest`, never hand-maintained
        # (see signoff/README.md). Re-rendering it here is what stops it
        # rotting: an evidence artifact that changed after the manifest pinned
        # its content_hash re-grades as unmet/stale_evidence, the committed
        # report stops matching, and this step fails instead of a stale green
        # row surviving.
        run: bash signoff/run-signoff.sh --check

      - name: sim/lib/check-characterization-coverage.sh (aggregated report vs. sim/ tree)
        # Why: the script's own header and its docs/claim-checker-inventory.md row.
        run: bash sim/lib/check-characterization-coverage.sh

      - name: sim/lib/check-record-supersession.sh (cited evidence vs. the sim/ supersession graph)
        # Why: the script's own header and its docs/claim-checker-inventory.md row.
        run: bash sim/lib/check-record-supersession.sh

      - name: spec/lib/check-spec-row-coverage.sh (proposal section 5 vs. spec/pll.md's summary table)
        # Why: the script's own header and its docs/claim-checker-inventory.md row.
        run: bash spec/lib/check-spec-row-coverage.sh

      - name: spec/lib/check-spur-derivation-arithmetic.sh (the reference-spur derivation vs. its own ingredients)
        # Why: the script's own header and its docs/claim-checker-inventory.md row.
        run: bash spec/lib/check-spur-derivation-arithmetic.sh

      - name: spec/lib/check-mismatch-charge-derivation.sh (the reference-spur charge totals vs. their own raw samples)
        # Why: the script's own header and its docs/claim-checker-inventory.md row.
        run: bash spec/lib/check-mismatch-charge-derivation.sh

      - name: design/lib/check-io-list-coverage.sh (proposal I/O list vs. the exported port list)
        # Why: the script's own header and its docs/claim-checker-inventory.md row.
        run: bash design/lib/check-io-list-coverage.sh

      - name: design/lib/check-port-connectivity.sh (declared ports vs. what a netlist actually wires)
        # Why: the script's own header and its docs/claim-checker-inventory.md row.
        run: bash design/lib/check-port-connectivity.sh

      - name: sim/lib/check-record-trim-connectivity.sh (committed evidence vs. the netlist snapshot it was taken on)
        # Why: the script's own header and its docs/claim-checker-inventory.md row.
        run: bash sim/lib/check-record-trim-connectivity.sh

      - name: sim/lib/check-pvt-coverage-claims.sh (quoted corners vs. the harness's corner registry)
        # Why: the script's own header and its docs/claim-checker-inventory.md row.
        run: bash sim/lib/check-pvt-coverage-claims.sh

      - name: sim/lib/check-ref-drive-claims.sh (quoted reproduction commands vs. the decks they promise)
        # Why: the script's own header and its docs/claim-checker-inventory.md row.
        run: bash sim/lib/check-ref-drive-claims.sh

      - name: sim/lib/check-bias-drive-claims.sh (bias-pin drive and quoted Limitations vs. the decks and records)
        # Why: the script's own header and its docs/claim-checker-inventory.md row.
        run: bash sim/lib/check-bias-drive-claims.sh

      - name: sim/lib/check-quoted-value-provenance.sh (quoted values vs. the committed per-corner evidence)
        # Why: the script's own header and its docs/claim-checker-inventory.md row.
        run: bash sim/lib/check-quoted-value-provenance.sh

      - name: docs/tests (unit tests for the issue-reference-state and claim-checker-inventory checks)
        # Same shape as the three discover steps above, for the two checks
        # added in #237 that grade what the outward-facing documents claim
        # about something other than the tree's evidence: one about the
        # *forge*, one about the *grading family itself*. Hermetic despite the
        # first check needing the forge: every test there puts a stub `gh`
        # first on PATH, so the issue states are part of the fixture. The
        # second builds a miniature family in a throwaway tree, so the count
        # it derives is the fixture's. No network, no token, no PDK.
        run: python3 -m unittest discover -s docs/tests -t docs/tests

      - name: docs/lib/check-issue-reference-state.sh (issue references vs. the forge)
        # Why: the script's own header and its docs/claim-checker-inventory.md row.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash docs/lib/check-issue-reference-state.sh

      - name: docs/lib/check-claim-checker-inventory.sh (the documents' checker counts vs. the tree)
        # Why: the script's own header and its docs/claim-checker-inventory.md row.
        run: bash docs/lib/check-claim-checker-inventory.sh

      - name: layout/lib/check-evidence-host-paths.sh (changed evidence files vs. host-absolute paths)
        # Why: the script's own header and its docs/claim-checker-inventory.md row.
        run: bash layout/lib/check-evidence-host-paths.sh --base "origin/${{ github.base_ref || 'main' }}"


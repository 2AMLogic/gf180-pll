name: "Development Task"
description: "Create a development task for gf180-pll"
labels: ["loom:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing to gf180-pll. Please check
        [CONTRIBUTING.md](https://github.com/2AMLogic/gf180-pll/blob/main/CONTRIBUTING.md)
        first. Issues are for actionable tasks: bugs, features, documentation,
        and verification work. For security problems, follow
        [SECURITY.md](https://github.com/2AMLogic/gf180-pll/blob/main/SECURITY.md)
        instead of filing here.

  - type: dropdown
    id: task_type
    attributes:
      label: "Task Type"
      description: "What type of development task is this?"
      options:
        - Bug Fix
        - Feature
        - Refactoring
        - Documentation
        - Testing
        - Infrastructure
        - Research
        - Improvement
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Task Description"
      description: "Clear, actionable description of what needs to be done"
      placeholder: |
        For bugs:
        Steps to reproduce:
        1. Run `bash sim/selftest.sh`
        2. Observe the output

        Expected: PASS
        Actual: the failure you see

        For features/improvements:
        - What problem does this solve?
        - How should it work?
        - Why is this needed?
        - Acceptance criteria?
    validations:
      required: true

  - type: textarea
    id: technical_notes
    attributes:
      label: "Technical Notes"
      description: "Implementation details, affected files, environment details, dependencies"
      placeholder: |
        - Files to modify: sim/harness/...
        - Related issues: #123, #456
        - Environment: Ubuntu 24.04, ngspice version
        - Breaking changes: No
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: "Priority (optional)"
      description: "How urgent is this task?"
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: false
